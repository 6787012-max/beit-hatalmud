              <line class="tick tick-minor" x1="28" y1="11.9" x2="31" y2="17.1"/>
            </g>
            <line id="handHour" class="clock-hand hand-hour" x1="50" y1="50" x2="50" y2="27"/>
            <line id="handMin" class="clock-hand hand-min" x1="50" y1="50" x2="50" y2="17"/>
            <line id="handSec" class="clock-hand hand-sec" x1="50" y1="50" x2="50" y2="15"/>
            <circle class="clock-center" cx="50" cy="50" r="2.6"/>
          </svg>
        </div>

      <div class="home-grid">
        <div id="homeReports"></div>
        <aside id="homeFollowupWidget" class="home-side"></aside>
      </div>

      <div id="teacherHome" style="display:none"></div>
