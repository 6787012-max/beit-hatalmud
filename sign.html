<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חתימת אישור — מכינה בית התלמוד</title>
  <link rel="stylesheet" href="vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="vendor/supabase.js"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <div class="sign-wrap">
    <div class="sign-card">
      <div class="sign-logo"><img src="img/logo.png" class="login-logo-img" alt="לוגו"></div>
      <div class="sign-inst" id="inst"></div>
      <div id="content"><p style="text-align:center;color:var(--muted)">טוען…</p></div>
    </div>
  </div>
  <script>
  (function () {
    const q = new URLSearchParams(location.search);
    const fid = q.get('f'), token = q.get('t'), gtok = q.get('g');
    const C = window.CV3 || {};
    const content = document.getElementById('content');
    document.getElementById('inst').textContent = C.INSTANCE_NAME || '';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const sb = (C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase)
      ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY) : null;

    const TYPES = ['text', 'textarea', 'select', 'checkbox', 'question', 'signature'];
    function parseFields(raw) {
      let arr = raw;
      if (typeof arr === 'string') { try { arr = JSON.parse(arr); } catch (_) { arr = null; } }
      if (!Array.isArray(arr)) arr = [];
      return arr.filter(x => x && x.label).map((x, i) => ({
        key: x.key || ('f' + i),
        label: String(x.label),
        type: TYPES.indexOf(x.type) >= 0 ? x.type : 'text',
        options: Array.isArray(x.options) ? x.options : [],
        required: !!x.required,
      }));
    }
    function parseAnswers(raw) {
      let a = raw;
      if (typeof a === 'string') { try { a = JSON.parse(a); } catch (_) { a = null; } }
      return (a && typeof a === 'object') ? a : {};
    }


  // ── עיצוב גוף הטופס ──────────────────────────────────────────────────
  // קודם הגוף נדחס ל-<p> אחד, ולכן טופס בן שבעה סעיפים נראה כמו גוש טקסט.
  // כאן שורה שמתחילה ב-## היא כותרת, שורה שמתחילה בתבליט היא פריט רשימה,
  // ושורה ריקה מפרידה פסקאות. הכל עובר escape — אין הזרקת HTML.
  function fmtBody(t) {
    if (!t) return '';
    var e2 = function (s) { return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
    var out = '', list = [];
    var flush = function () { if (list.length) { out += '<ul class="fb-ul">' + list.join('') + '</ul>'; list = []; } };
    String(t).split(/\n/).forEach(function (ln) {
      var s = ln.trim();
      if (!s) { flush(); return; }
      if (s.indexOf('##') === 0) { flush(); out += '<h3 class="fb-h">' + e2(s.replace(/^#+\s*/, '')) + '</h3>'; return; }
      if (s.charAt(0) === '•' || s.charAt(0) === '-') { list.push('<li>' + e2(s.replace(/^[•\-]\s*/, '')) + '</li>'); return; }
      flush(); out += '<p class="fb-p">' + e2(s) + '</p>';
    });
    flush();
    return '<div class="fb">' + out + '</div>';
  }

    if (!token && !gtok) { content.innerHTML = '<h2>קישור לא תקין</h2><p>הקישור אינו תקין או שפג תוקפו. פנו למכינה לקבלת קישור מעודכן.</p>'; return; }
    if (!sb) {
      content.innerHTML = '<h2>מצב הדגמה</h2><p>המערכת נמצאת במצב הדגמה. חתימת הורים פעילה במערכת החיה של המוסד (לאחר חיבור Supabase ע״י המנהל).</p>';
      return;
    }

    async function load() {
      // גישה מאובטחת דרך RPC (SECURITY DEFINER) — לפי טוקן אישי, או לפי מזהה טופס לקישור כללי.
      let form = null, resp = null;
      if (token) {
        // קישור אישי לתלמיד — לפי טוקן חד-פעמי
        const { data } = await sb.rpc('get_signing', { p_token: token });
        if (data && data[0]) {
          const d = data[0];
          form = { title: d.title, body: d.body, fields: parseFields(d.fields) };
          resp = { status: d.status, signer_name: d.signer_name, signed_at: d.signed_at, answers: parseAnswers(d.answers), signature: d.signature };
        }
      } else if (gtok) {
        // קישור כללי ציבורי — לפי קוד אקראי; נפתח רק אם הטופס פעיל ולא פג תוקף
        const { data } = await sb.rpc('get_public_form', { g_token: gtok });
        if (data && data[0]) form = { title: data[0].title, body: data[0].body, fields: parseFields(data[0].fields) };
      }
      if (!form) {
        content.innerHTML = gtok
          ? '<h2>הטופס סגור</h2><p>הטופס אינו פתוח למילוי כרגע — ייתכן שהסתיים המועד. פנו למכינה.</p>'
          : '<h2>הטופס לא נמצא</h2><p>ייתכן שהקישור אינו תקין או שהטופס הוסר.</p>';
        return;
      }
      render(form, resp);
    }

    // ⚠️ **החתימה נשמרת כקווים ולא כתמונה.**
    // קודם היא נשלחה כ-`canvas.toDataURL('image/png')` — 10–50KB של base64 של
    // תמונה בתוך גוף ה-POST. נטפרי סורק את גוף הבקשה ומזהה שם תמונה, ולכן
    // שליחת הטופס נחסמה אצל הורים. עכשיו נשלח JSON של קואורדינטות בלבד:
    // מספרים, בלי שום בייט של תמונה — אין מה לחסום, וגם הנפח קטן פי כמה.
    // הציור משוחזר כ-SVG בצד המציג. הפורמט: {v:1,w,h,s:[[[x,y],...],...]}
    // תמונות ישנות (data:image/...) ממשיכות להיות מוצגות כרגיל.
    const SIG_V = 1;
    function sigToSVG(sig, opts) {
      opts = opts || {};
      let d;
      try { d = typeof sig === 'string' ? JSON.parse(sig) : sig; } catch (_) { return ''; }
      if (!d || !d.s || !d.s.length) return '';
      const w = d.w || 600, h = d.h || 160;
      const paths = d.s.filter(st => st && st.length).map(st =>
        '<path d="M' + st.map(pt => pt[0] + ' ' + pt[1]).join(' L') + '"/>').join('');
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" ' +
        'style="' + (opts.style || 'width:100%;max-width:320px;height:auto') + '" ' +
        'fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        paths + '</svg>';
    }
    // מציג חתימה בכל אחד משני הפורמטים
    function sigHTML(sig) {
      if (!sig) return '';
      if (/^data:image\//.test(sig)) {
        return '<img src="' + esc(sig) + '" alt="חתימה" style="max-width:100%;border:1px solid var(--line,#ccc);border-radius:8px;background:#fff">';
      }
      const svg = sigToSVG(sig, { style: 'width:100%;max-width:320px;height:auto;background:#fff;border:1px solid var(--line,#ccc);border-radius:8px' });
      return svg || '';
    }

    // בונה קנבס לחתימה ידנית (עכבר + מגע). מחזיר isBlank ו-strokes.
    function setupCanvas(canvas) {
      const ctx = canvas.getContext('2d');
      // התאמת רזולוציה לרוחב בפועל
      const ratio = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || 300, cssH = canvas.clientHeight || 150;
      canvas.width = cssW * ratio; canvas.height = cssH * ratio;
      ctx.scale(ratio, ratio);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cssW, cssH);
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      let drawing = false, dirty = false, lastX = 0, lastY = 0;
      const strokes = [];                 // [[x,y],...] לכל משיכת עט
      let cur = null;
      const R = v => Math.round(v * 10) / 10;   // עשירית פיקסל — די והותר לחתימה
      const pos = e => {
        const rc = canvas.getBoundingClientRect();
        const t = (e.touches && e.touches[0]) || e;
        return { x: t.clientX - rc.left, y: t.clientY - rc.top };
      };
      const start = e => {
        e.preventDefault(); drawing = true;
        const p = pos(e); lastX = p.x; lastY = p.y;
        cur = [[R(p.x), R(p.y)]]; strokes.push(cur);
      };
      const move = e => {
        if (!drawing) return; e.preventDefault();
        const p = pos(e);
        ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
        lastX = p.x; lastY = p.y; dirty = true;
        if (cur) cur.push([R(p.x), R(p.y)]);
      };
      const end = () => { drawing = false; cur = null; };
      canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);
      return {
        clear() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cssW, cssH); dirty = false; strokes.length = 0; cur = null; },
        isBlank() { return !dirty; },
        // JSON של קווים — לא תמונה. ראה ההערה למעלה.
        value() { return JSON.stringify({ v: SIG_V, w: Math.round(cssW), h: Math.round(cssH), s: strokes }); },
      };
    }

    function fieldInputHTML(fld) {
      const id = 'fld_' + fld.key;
      const req = fld.required ? ' <span style="color:#c0392b">*</span>' : '';
      let inner = '';
      if (fld.type === 'text') inner = '<input class="inp" id="' + id + '">';
      else if (fld.type === 'textarea' || fld.type === 'question') inner = '<textarea class="inp" id="' + id + '" rows="3"></textarea>';
      else if (fld.type === 'select') inner = '<select class="inp" id="' + id + '"><option value="">— בחר —</option>' + fld.options.map(o => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join('') + '</select>';
      else if (fld.type === 'checkbox') return '<label class="fld fld-wide" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="' + id + '"><span>' + esc(fld.label) + req + '</span></label>';
      else if (fld.type === 'signature') return '<div class="fld fld-wide"><span>' + esc(fld.label) + req + '</span>' +
        '<canvas id="' + id + '" class="sign-canvas" style="width:100%;height:160px;border:1px dashed var(--line,#bbb);border-radius:10px;background:#fff;touch-action:none;display:block"></canvas>' +
        '<button type="button" class="btn-ghost sm" data-clear="' + id + '" style="margin-top:6px"><i class="bi bi-eraser"></i> נקה</button></div>';
      return '<label class="fld fld-wide"><span>' + esc(fld.label) + req + '</span>' + inner + '</label>';
    }

    function render(form, resp) {
      const signed = resp && resp.status === 'signed';
      const fields = (form.fields && form.fields.length) ? form.fields : [];
      if (signed) {
        const ans = resp.answers || {};
        const ansHTML = fields.filter(f => f.type !== 'signature').map(f => {
          let v = ans[f.key];
          if (f.type === 'checkbox') v = (v === true || v === 'true' || v === 'כן') ? 'כן' : 'לא';
          if (v == null || v === '') v = '—';
          return '<div class="det-row"><span class="det-lbl">' + esc(f.label) + '</span><span class="det-val">' + esc(v) + '</span></div>';
        }).join('');
        const sigInner = sigHTML(resp.signature);
        const sig = sigInner
          ? '<div style="margin-top:10px"><div style="color:var(--muted);font-size:.85rem;margin-bottom:4px">חתימה:</div>' + sigInner + '</div>'
          : '';
        content.innerHTML =
          '<h2>' + esc(form.title) + '</h2>' +
          (form.body ? fmtBody(form.body) : '') +
          '<div class="sign-done"><i class="bi bi-check2-circle"></i><div>התקבלה חתימה בתאריך ' + esc(resp.signed_at || '') + ' על-ידי ' + esc(resp.signer_name || '') + '.<br>תודה רבה!</div></div>' +
          (ansHTML ? '<div class="det-grid" style="margin-top:10px">' + ansHTML + '</div>' : '') + sig;
        return;
      }

      content.innerHTML =
        '<h2>' + esc(form.title) + '</h2>' +
        (form.body ? fmtBody(form.body) : '') +
        '<label class="fld fld-wide"><span>שם החותם (הורה) *</span><input class="inp" id="sname" placeholder="שם מלא"></label>' +
        fields.map(fieldInputHTML).join('') +
        '<button class="btn-primary" id="signBtn" style="width:100%;margin-top:8px"><i class="bi bi-pencil-square"></i> אני מאשר/ת וחותם/ת</button>';

      // הפעלת קנבסים
      const canvases = {};
      fields.forEach(f => { if (f.type === 'signature') { const el = document.getElementById('fld_' + f.key); if (el) canvases[f.key] = setupCanvas(el); } });
      content.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => {
        const key = b.dataset.clear.replace(/^fld_/, ''); if (canvases[key]) canvases[key].clear();
      }));

      const btn = document.getElementById('signBtn');
      btn.addEventListener('click', async () => {
        const name = document.getElementById('sname').value.trim();
        if (name.length < 2) { alert('נא להזין שם מלא'); return; }

        // איסוף תשובות + ולידציה
        const answers = {};
        let sigValue = '';
        for (const f of fields) {
          const el = document.getElementById('fld_' + f.key);
          if (f.type === 'signature') {
            const cv = canvases[f.key];
            if (cv && !cv.isBlank()) sigValue = cv.value();
            if (f.required && (!cv || cv.isBlank())) { alert('נא לחתום בשדה "' + f.label + '"'); return; }
            continue;
          }
          let val;
          if (f.type === 'checkbox') val = el && el.checked;
          else val = el ? el.value.trim() : '';
          if (f.required && (val === '' || val === false || val == null)) { alert('נא למלא את השדה "' + f.label + '"'); return; }
          answers[f.key] = val;
        }
        btn.disabled = true;
        let res;
        if (token) {
          res = await sb.rpc('submit_signature', { p_token: token, p_name: name, p_answers: answers, p_signature: sigValue || null });
        } else {
          res = await sb.rpc('submit_public_form', { g_token: gtok, p_name: name, p_answers: answers, p_signature: sigValue || null });
        }
        if (res.error || res.data === false) { alert('שגיאה בשליחה. ייתכן שהטופס נסגר או שכבר נשלח.'); btn.disabled = false; return; }
        render(form, { status: 'signed', signer_name: name, signed_at: new Date().toISOString().slice(0, 10), answers: answers, signature: sigValue });
      });
    }
    load();
  })();
  </script>
</body>
</html>
