# Worker שקולט דיווחים קוליים משלוחה 9 בימות — רץ בענן, לא תלוי במחשב.
name = "bht-voice-reports"
main = "src/index.js"
compatibility_date = "2026-08-01"

[triggers]
# כל 5 דקות. דיווח קולי לא דחוף לשנייה, וזה מספיק תכוף שאיש צוות
# שהתקשר יראה את הדיווח במערכת עוד לפני שהגיע לישיבה.
crons = ["*/5 * * * *"]

[observability]
enabled = true

