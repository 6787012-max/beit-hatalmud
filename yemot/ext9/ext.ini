; שלוחה 9 — דיווח קולי של הצוות (מכינת בית התלמוד)
; ------------------------------------------------------------------
; איש צוות מתקשר, אומר את שמו, את שם התלמיד ואת הדיווח — וזהו.
; ההקלטה נשמרת בתיקיית השלוחה, ונשלחת גם למייל של המכינה עם תמלול.
; משם Cloudflare Worker מתוזמן (רץ בענן, לא תלוי במחשב) שולף אותה,
; מסווג אותה מול רשימת התלמידים, ומכניס טיוטת דיווח למערכת.
;
; ⚠️ כל פרמטר כאן מאומת מול התיעוד הרשמי. אין להוסיף פרמטרים "הגיוניים"
;    שלא מופיעים בתיעוד — ימות מתעלמת מהם או שהם שוברים את השלוחה.

type=record

; שתיקה 3 שניות מסיימת · מינימום 5 שניות · מקסימום 3 דקות
option_record=3-5-180

; הקלטה קצרה מ-5 שניות היא כמעט תמיד טעות — לא שומרים
record_no_save_if_time_little=5

; סולמית מסיימת ומאשרת את ההקלטה
record_ok=#

; ההקלטה נשארת בתיקיית השלוחה — שם ה-Worker סורק אותה
folder_move=this_folder

; עותק למייל של המכינה, כולל תמלול אוטומטי של ימות.
; זהו גם גיבוי: גם אם ה-Worker ייפול, הדיווח מגיע לתיבה.
email_send=yes
email_address=6787012@gmail.com
email_title=דיווח קולי חדש — מכינת בית התלמוד
record_tts_to_mail=yes

; בסיום — חזרה לתפריט הראשי של הקו
record_end_goto=/

; רק אנשי צוות מורשים. ⚠️ הפרמטר הזה בלי WhiteList.ini תקין חוסם את כולם —
; הקובץ נוצר יחד עם השלוחה ואסור למחוק אותו.
white_list=yes
