<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך לובי — מכינה בית התלמוד</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="../vendor/heebo.css" rel="stylesheet">
<link rel="stylesheet" href="../vendor/bootstrap-icons.css">
<style>
/* מסך הלובי — נבנה למסך גדול בקיוסק. כל התוכן נשלט מהפאנל שבאתר (מסך הלובי). */
*{box-sizing:border-box;margin:0;padding:0}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none;-ms-overflow-style:none}
:root{
  --navy:#003048; --navy-2:#00405f; --gold:#a87830; --gold-lt:#e3b96b;
  --ink:#fff; --muted:#9fb3c0; --card:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.13); --ok:#3ecf8e;
}
html,body{width:100%;height:100%;overflow:hidden;background:#00131e;color:var(--ink);
  font-family:'Heebo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(1200px 800px at 85% -10%,rgba(168,120,48,.20),transparent 60%),
  radial-gradient(1000px 700px at 10% 110%,rgba(0,64,95,.55),transparent 60%),
  linear-gradient(160deg,#00131e,#001c2b 55%,#00131e)}
#bg::after{content:"";position:absolute;inset-inline-end:-60px;bottom:-60px;width:380px;height:380px;
  background:url(../img/logo.png) center/contain no-repeat;opacity:.05}

#stage{position:relative;z-index:2;display:grid;grid-template-columns:minmax(300px,23%) 1fr;
  grid-template-rows:1fr auto;gap:16px;height:100vh;padding:16px}
aside{grid-row:1/2;display:flex;flex-direction:column;gap:calc(12px*var(--side,1));min-height:0;--side:1}
main{grid-row:1/2;position:relative;border-radius:20px;overflow:hidden;background:#000;
  border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.6)}
footer{grid-column:1/-1}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:calc(14px*var(--side,1)) calc(16px*var(--side,1));backdrop-filter:blur(14px)}
.card h3{font-size:calc(.82rem*var(--side,1));font-weight:700;letter-spacing:.04em;color:var(--gold-lt);
  margin-bottom:calc(9px*var(--side,1));display:flex;align-items:center;gap:7px;text-transform:none}

/* שעון */
#clockCard{text-align:center;container-type:inline-size;padding-bottom:calc(10px*var(--side,1))}
#clock{font-size:calc(clamp(2.6rem,26cqi,5.4rem)*var(--side,1));font-weight:800;line-height:1;letter-spacing:-2px;
  font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(255,255,255,.25)}
#clock .sc{opacity:.45;font-size:.45em;font-weight:600;margin-inline-start:6px;letter-spacing:0}
#dHeb{color:var(--gold-lt);font-size:calc(1.15rem*var(--side,1));font-weight:600;margin-top:6px}
#dGreg{color:var(--muted);font-size:calc(.86rem*var(--side,1));margin-top:2px}
#meta{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;margin-top:calc(10px*var(--side,1));
  color:var(--muted);font-size:calc(.86rem*var(--side,1))}
#meta b{color:#dbe7ee;font-weight:600}
#parasha{margin-top:calc(9px*var(--side,1));font-size:calc(.95rem*var(--side,1));color:var(--gold-lt);background:rgba(168,120,48,.14);
  border:1px solid rgba(168,120,48,.3);border-radius:10px;padding:5px 9px;display:none}
#zmanim{display:none;gap:4px 10px;flex-wrap:wrap;justify-content:center;margin-top:calc(9px*var(--side,1));
  font-size:calc(.8rem*var(--side,1));color:var(--muted)}
#zmanim span b{color:#cfe0ea;font-weight:600}

/* תפריט */
#menuCard{display:none}
#menuDay{font-size:calc(.8rem*var(--side,1));color:var(--muted);margin-bottom:6px}
#menuMain{font-size:calc(1.5rem*var(--side,1));font-weight:800;line-height:1.15}
#menuSide{font-size:calc(1.05rem*var(--side,1));color:#d7e6ee;margin-top:3px}
#menuVeg{font-size:calc(.95rem*var(--side,1));color:var(--muted);margin-top:2px}
#menuNote{font-size:calc(.85rem*var(--side,1));color:var(--gold-lt);margin-top:6px}

/* סדר יום */
#agendaCard{flex:1;display:flex;flex-direction:column;min-height:0;--ag-font:1.05rem;--ag-pad:9px;--ag-gap:3px}
/* המסכה נשארת רק כרשת ביטחון: ההתאמה בזמן ריצה אמורה להכניס את כל השורות */
#agenda{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:var(--ag-gap);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 5%,#000 92%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 5%,#000 92%,transparent)}
.ag{display:flex;align-items:center;gap:10px;padding:var(--ag-pad) 10px;border-radius:11px;
  font-size:var(--ag-font);opacity:.62;transition:opacity .35s,background .35s;line-height:1.25}
.ag .t{color:var(--gold-lt);font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
.ag.done{opacity:.32}
.ag.now{opacity:1;background:linear-gradient(90deg,rgba(168,120,48,.34),rgba(168,120,48,.06));
  border-inline-start:4px solid var(--gold);font-weight:700;padding-inline-start:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:calc(var(--ag-font)*1.14);
  animation:pop .5s ease-out}
/* המשבצת שהתחלפה קופצת רגע, כדי שמי שמרים את העיניים יראה שהשעה התחלפה */
@keyframes pop{0%{transform:scale(.96);box-shadow:0 0 0 rgba(168,120,48,0)}
  55%{transform:scale(1.035);box-shadow:0 0 26px rgba(168,120,48,.55)}
  100%{transform:scale(1)}}
.ag.next{opacity:.9}
/* משבצת שממתינה להתחלה (אחרי צלצול הסיום של הקודמת) — מודגשת אך לא "רצה" */
.ag.now.waiting{background:linear-gradient(90deg,rgba(120,160,190,.28),rgba(120,160,190,.05));
  border-inline-start-color:#7fa8c4}
.ag.now.waiting .cd{color:#bcd7e8}
.ag .k{margin-inline-start:auto;font-size:.7rem;color:var(--muted);opacity:.8}
/* ספירה לאחור בשורה הפעילה */
.ag .cd{margin-inline-start:auto;font-variant-numeric:tabular-nums;font-weight:800;
  font-size:.95em;color:var(--gold-lt);white-space:nowrap}
.ag.now .k{display:none}
.ag.warn{background:linear-gradient(90deg,rgba(168,120,48,.5),rgba(168,120,48,.12))}
.ag.warn .cd{color:#ffd98a}
.ag.last{background:linear-gradient(90deg,rgba(190,70,60,.55),rgba(190,70,60,.12));
  border-inline-start-color:#e0705f}
.ag.last .cd{color:#ffb3a7;animation:blink 1s infinite}
#agBar{height:4px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:12px;overflow:hidden;display:none;flex:0 0 auto}
#agBar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--gold-lt));transition:width 1s linear}

/* וידאו */
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;
  transition:opacity 1.2s ease-in-out}
video.off{opacity:0}
#vinfo{position:absolute;inset-inline:0;bottom:0;padding:10px 18px;display:flex;justify-content:space-between;
  background:linear-gradient(to top,rgba(0,0,0,.75),transparent);font-size:.8rem;color:#c7d6de;
  opacity:0;transition:opacity .25s}
main:hover #vinfo{opacity:1}

/* תוכנית ההפסקות (18/10/2026): שיח מעורר ← 10 שניות הסבר ← מושג בגמרא.
   יוסף: "הסרטונים על מסך מלא, מעוצב יפה וגדול — אבל שיהיה עדיין השעון ועוד כמה זמן הפסקה".
   כל המסך לסרטון; פס מידע בתחתית — מתחת לסרטון ולא עליו, כדי לא לכסות את הכתוביות שבתוכו. */
:root{--pbH:clamp(84px,11.5vh,128px)}
body.prog-on #stage{grid-template-columns:1fr;grid-template-rows:1fr;padding:0;gap:0}
body.prog-on aside, body.prog-on footer{display:none}
body.prog-on main{grid-column:1/-1;grid-row:1/-1;border:0;border-radius:0;box-shadow:none;
  background:radial-gradient(ellipse at 50% 38%,#163240 0%,#0a161c 58%,#05090c 100%)}
body.prog-on main video{inset:auto;left:50%;top:calc((100vh - var(--pbH) - min(100vh - var(--pbH) - 28px,(100vw - 40px)*9/16))/2);
  transform:translateX(-50%);width:min(100vw - 40px,(100vh - var(--pbH) - 28px)*16/9);height:auto;aspect-ratio:16/9;
  border-radius:16px;box-shadow:0 0 0 1px rgba(224,169,59,.35),0 26px 80px rgba(0,0,0,.75),0 0 120px rgba(224,169,59,.10)}
body.prog-on #vinfo, body.prog-on #ov{display:none}
body.prog-on #progCard{bottom:var(--pbH)}
#progBadge{position:absolute;inset-inline:0;bottom:0;height:var(--pbH);z-index:6;display:none;align-items:center;gap:clamp(18px,2.4vw,46px);
  padding:0 clamp(22px,2.6vw,52px);background:linear-gradient(to top,#04090c 0%,rgba(6,14,19,.97) 100%);
  border-top:2px solid rgba(224,169,59,.55);box-shadow:0 -18px 50px rgba(0,0,0,.45);color:#fff;white-space:nowrap}
body.prog-on #progBadge{display:flex}
#pbClock{font-size:calc(var(--pbH)*.56);font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
#pbClock .bl{animation:bl 1.1s infinite}
#pbSep{width:2px;align-self:stretch;margin:calc(var(--pbH)*.2) 0;background:linear-gradient(transparent,rgba(224,169,59,.6),transparent)}
#pbMid{flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--pbH)*.07)}
#pbRow{display:flex;align-items:baseline;gap:18px}
#pbTitle{font-size:calc(var(--pbH)*.24);font-weight:800;color:var(--gold-lt)}
#pbLeft{font-size:calc(var(--pbH)*.24);font-weight:800;font-variant-numeric:tabular-nums;margin-inline-start:auto}
#pbLeft.warn{color:#ffd98a}#pbLeft.last{color:#ff9f8d;animation:blink 1s infinite}
#pbTrack{height:calc(var(--pbH)*.075);border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#pbTrack i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-lt));transition:width 1s linear}
#pbNow{font-size:calc(var(--pbH)*.17);color:#c9d6da;overflow:hidden;text-overflow:ellipsis}
#pbNow b{color:#fff;font-weight:700}
#pbLogo{height:calc(var(--pbH)*.62);opacity:.95}
@keyframes blink{50%{opacity:.35}}
#progCard{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.8vh;text-align:center;padding:4vw;background:radial-gradient(ellipse at 50% 40%,#17323C 0%,#0B1418 72%);
  opacity:0;pointer-events:none;transition:opacity .6s}
#progCard.on{opacity:1}
#pcKick{font-size:clamp(1.3rem,2.4vw,2.3rem);font-weight:800;color:#0B1418;background:var(--gold);padding:.25em 1.1em;border-radius:99px}
#pcTitle{font-size:clamp(3.2rem,8vw,8rem);font-weight:900;line-height:1.05;color:#fff}
#pcSub{font-size:clamp(1.5rem,3.2vw,3rem);font-weight:700;color:var(--gold-lt)}
#pcExp{font-size:clamp(1.2rem,2.3vw,2.1rem);color:#c9d6da;max-width:32ch}
#pcRing{position:relative;width:clamp(130px,14vw,230px);height:clamp(130px,14vw,230px);margin-top:1vh}
#pcRing svg{width:100%;height:100%;transform:rotate(-90deg)}
#pcRing circle{fill:none;stroke-width:11}
#pcNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(3.2rem,6.5vw,6rem);font-weight:900;color:#fff}

/* מסך שיעור / מנוחה */
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:30px;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s;
  background:radial-gradient(ellipse at center,#00243a 0%,#00131e 75%)}
#ov.on{opacity:1;pointer-events:auto}
#ovClock{font-size:calc(clamp(5rem,17vw,15rem)*var(--s,1));font-weight:800;line-height:.95;letter-spacing:-5px;
  font-variant-numeric:tabular-nums;text-shadow:0 0 70px rgba(255,255,255,.22)}
#ovClock .bl{animation:bl 1.1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
#ovTitle{font-size:calc(clamp(1.6rem,3.6vw,3.2rem)*var(--s,1));font-weight:700;color:var(--gold-lt)}
#ovSub{font-size:calc(clamp(1rem,1.8vw,1.5rem)*var(--s,1));color:var(--muted)}
#ovBarWrap{width:min(560px,70%);height:8px;border-radius:99px;background:rgba(255,255,255,.12);
  overflow:hidden;margin-top:14px;display:none}
#ovBar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-lt));
  border-radius:99px;transition:width 1s linear}
/* חמש הדקות האחרונות: המסך עובר לספירה לאחור, ובדקה האחרונה היא נצבעת ופועמת */
#ovCd{display:none;font-size:calc(clamp(4.5rem,15vw,13rem)*var(--s,1));font-weight:800;line-height:.95;
  letter-spacing:-4px;font-variant-numeric:tabular-nums;color:var(--gold-lt);
  text-shadow:0 0 70px rgba(168,120,48,.45)}
#ov.cd-on #ovClock{display:none}
#ov.cd-on #ovCd{display:block}
#ov.cd-last #ovCd{color:#ff9f8d;text-shadow:0 0 80px rgba(224,112,95,.5);animation:blink 1s infinite}
#ov.cd-last #ovTitle{color:#ff9f8d}

/* קרוסלת המידע במסך הגדול */
/* המעבר עובר דרך רקע כהה: השקופית היוצאת דוהה, ורק אז הנכנסת עולה. בלי ההשהיה
   שתי שכבות הטקסט נראו זו מבעד לזו באמצע ה-fade. */
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:36px;text-align:center;opacity:0;pointer-events:none;transition:opacity .55s ease-in;
  overflow:hidden}
.slide.on{opacity:1;transition:opacity .55s ease-out .55s}
.sl-kicker{font-size:calc(clamp(.9rem,1.5vw,1.3rem)*var(--s,1));letter-spacing:.22em;color:var(--gold);opacity:.85}
.sl-title{font-size:calc(clamp(2rem,5.5vw,4.6rem)*var(--s,1));font-weight:800;line-height:1.1}
.sl-sub{font-size:calc(clamp(1.05rem,2vw,1.8rem)*var(--s,1));color:var(--muted)}
/* מזל טוב */
#slBirth .cake{font-size:calc(clamp(3rem,7vw,6rem)*var(--s,1));line-height:1}
#slBirth .names{display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center;margin-top:6px}
#slBirth .nm{font-size:calc(clamp(1.35rem,3.2vw,2.8rem)*var(--s,1));font-weight:800;color:#fff;max-width:15ch}
#slBirth .nm small{display:block;font-size:.42em;font-weight:600;color:var(--gold-lt);margin-top:2px}
#slBirth .soon{margin-top:20px;font-size:calc(clamp(.95rem,1.6vw,1.35rem)*var(--s,1));color:var(--muted);
  border-top:1px solid var(--line);padding-top:12px;max-width:80%}
#slBirth .soon b{color:#dbe7ee;font-weight:600}
/* תפריט גדול */
#slMenu .dish{font-size:calc(clamp(2.2rem,6vw,5rem)*var(--s,1));font-weight:800}
#slMenu .side{font-size:calc(clamp(1.3rem,3vw,2.4rem)*var(--s,1));color:#d7e6ee;margin-top:4px}
#slMenu .veg{font-size:calc(clamp(1.05rem,2.2vw,1.7rem)*var(--s,1));color:var(--muted)}
/* סדר יום מלא */
#slAgenda .list{width:min(860px,92%);max-height:76%;overflow:hidden;display:flex;flex-direction:column;gap:4px;text-align:start}
#slAgenda .ag{font-size:calc(clamp(1rem,2.2vh,1.4rem)*var(--s,1))}
/* הודעה */
#slMsg .msg{font-size:calc(clamp(1.6rem,4vw,3.4rem)*var(--s,1));font-weight:700;line-height:1.3;max-width:88%}

/* כרטיס ימי הולדת בסרגל */
#birthCard{display:none}
#birthToday{font-size:calc(1.12rem*var(--side,1));font-weight:800;line-height:1.3}
#birthToday div+div{margin-top:5px}
#birthToday small{color:var(--gold-lt);font-weight:600;font-size:.7em}
#birthNext{margin-top:calc(8px*var(--side,1));font-size:calc(.88rem*var(--side,1));color:var(--muted);display:flex;flex-direction:column;gap:3px}
#birthNext b{color:#dbe7ee;font-weight:600}

/* פס תחתון */
footer{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:10px 16px;backdrop-filter:blur(14px);overflow:hidden}
#brand{font-weight:800;color:var(--gold-lt);white-space:nowrap;font-size:1rem}
#brand i{opacity:.7;margin-inline-end:6px}
#tickWrap{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tick{display:inline-block;white-space:nowrap;animation:sc 60s linear infinite;font-size:1.05rem}
#tick .sep{color:var(--gold);margin:0 22px;opacity:.7}
#tick .hi{color:var(--gold-lt);font-weight:700}
@keyframes sc{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#dot{width:9px;height:9px;border-radius:50%;background:#5a6b75;flex:0 0 auto}
#dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
#dot.err{background:#e05a5a}

/* לא בתחתית — שם הוא חפף את הפס התחתון */
#hint{position:fixed;inset-inline-start:16px;top:16px;z-index:9;font-size:.78rem;color:var(--muted);
  background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:10px;padding:7px 11px;
  opacity:0;transition:opacity .3s;pointer-events:none;max-width:46vw}
#hint.on{opacity:1}
#fsBtn{position:fixed;inset-inline-end:16px;top:16px;z-index:20;width:52px;height:52px;border-radius:14px;
  background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--gold-lt);font-size:1.3rem;cursor:pointer;
  opacity:0;transition:opacity .25s,transform .15s}
#fsBtn:hover{transform:scale(1.08);background:rgba(168,120,48,.25)}
body:hover #fsBtn,#fsBtn.show{opacity:.9}
body.fs #fsBtn{display:none}
@media (max-width:900px){#stage{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  aside{grid-row:1/2}main{grid-row:2/3;min-height:40vh}}
/* מסך נמוך: סדר היום קודם לכל השאר. מה שיורד כאן ממשיך להופיע בקרוסלה. */
@media (max-height:860px){ #birthCard{display:none !important} }
@media (max-height:740px){ #menuCard{display:none !important} #zmanim{display:none !important} }
@media (max-height:640px){ #parasha{display:none !important} }

/* ══ שדרוג עיצוב 28/10/2026 — רק שכבת מראה: אותם אלמנטים ואותה לוגיקה ══ */
#bg{background:
  radial-gradient(1100px 760px at 88% -12%,rgba(224,169,59,.24),transparent 62%),
  radial-gradient(900px 700px at 6% 112%,rgba(0,96,130,.55),transparent 62%),
  radial-gradient(700px 500px at 45% 55%,rgba(0,60,90,.35),transparent 70%),
  linear-gradient(160deg,#00111b,#001a29 55%,#000f18)}
#bg::before{content:"";position:absolute;inset:-20%;opacity:.5;
  background:radial-gradient(circle at 30% 30%,rgba(227,185,107,.10),transparent 30%),
             radial-gradient(circle at 70% 65%,rgba(62,160,200,.10),transparent 32%);
  animation:drift 48s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-3%,-2%) rotate(0)}to{transform:translate(3%,2%) rotate(8deg)}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.11);box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset-inline:18%;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--gold-lt),transparent);opacity:.75}
.card h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(227,185,107,.45),transparent);margin-inline-start:6px}

<script>
(function () {
'use strict';

// ── חיבורים ──────────────────────────────────────────────────────────────
var SB_URL = 'https://jpcepdbhouuwpjdidqfo.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwY2VwZGJob3V1d3BqZGlkcWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTY1NDIsImV4cCI6MjEwMjAzMjU0Mn0.SR1cwgyI6eDv5aXqPkL4Nu0UINuvaWIh4jtElO44LS0';
// שרת הסרטונים המקומי. כשהדף מוגש ממנו — נתיבים יחסיים; מ-https אי אפשר לפנות ל-http (Mixed Content),
// ואז המסך עובר אוטומטית למצב "לוח מידע בלבד".
var LOCAL = (location.port === '8484') ? '' : (location.protocol === 'https:' ? null : 'http://localhost:8484');

var DEF = { headline:'מכינה בית התלמוד', city:'בית שמש', lat:31.747, lon:34.988, geonameid:295432,
  showWeather:true, showParasha:true, showZmanim:true, showMenu:true, showMessages:true, showAgenda:true,
  showBirthdays:true, videosEnabled:false, videosOnlyOnBreaks:true, crossfadeSec:3, refreshSec:60,
  lessonScreen:'clock', videoRoot:'', videoFolders:[],
  slides:['clock','birthdays','menu','agenda','message'], slideSec:18 };

var cfg = { schedule:{ default:[], byDay:{}, offDays:[5,6] }, menu:{ days:{} }, messages:{ items:[] },
  birthdays:{ items:[] }, display:DEF };
var srv = { ok:false, root:'', exists:false, folders:[], videos:[] };
var $ = function (id) { return document.getElementById(id); };
var pad = function (n) { return String(n).padStart(2, '0'); };

function hint(msg) { var h = $('hint'); h.textContent = msg || ''; h.className = msg ? 'on' : ''; }

// ── תאריך עברי (גימטריה — Intl לבדו מחזיר ספרות) ────────────────────────
function gematria(n) {
  var H = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],
           [30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  n = Number(n) % 1000;
  if (n === 15) return 'ט״ו';
  if (n === 16) return 'ט״ז';
  var out = '';
  for (var i = 0; i < H.length; i++) while (n >= H[i][0]) { out += H[i][1]; n -= H[i][0]; }
  if (!out) return '';
  return out.length > 1 ? out.slice(0, -1) + '״' + out.slice(-1) : out + '׳';
}
function hebDate(d) {
  try {
    var p = new Intl.DateTimeFormat('he-u-ca-hebrew', { day:'numeric', month:'long', year:'numeric' }).formatToParts(d);
    var get = function (t) { var x = p.find(function (q) { return q.type === t; }); return x ? x.value : ''; };
    var mo = get('month'); if (mo && mo.charAt(0) !== 'ב') mo = 'ב' + mo;
    return gematria(parseInt(get('day'), 10)) + ' ' + mo + ' ' + gematria(parseInt(String(get('year')).replace(/\D/g, ''), 10));
  } catch (e) { return ''; }
}
var DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var isoOf = function (d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

// ── הגדרות מהענן ─────────────────────────────────────────────────────────
// מקור אחד לצורת ההגדרות — גם מהענן וגם מה-cache. בלעדיו עותק שנשמר בגרסה
// קודמת (בלי מפתח שנוסף מאז) הפיל את המסך בטעינה.
function normalize(raw) {
  raw = raw || {};
  return {
    schedule:  Object.assign({ default:[], byDay:{}, offDays:[5,6] }, raw.schedule || {}),
    menu:      Object.assign({ days:{} }, raw.menu || {}),
    messages:  Object.assign({ items:[] }, raw.messages || {}),
    birthdays: Object.assign({ items:[] }, raw.birthdays || {}),
    display:   Object.assign({}, DEF, raw.display || {}),
  };
}
function applyCache() {
  try {
    var c = JSON.parse(localStorage.getItem('lobbyCfg') || 'null');
    if (c) cfg = normalize(c);
  } catch (e) {}
}
async function pullConfig() {
  try {
    var r = await fetch(SB_URL + '/rest/v1/lobby_config?select=key,value', {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var rows = await r.json(), next = {};
    rows.forEach(function (x) { next[x.key] = x.value || {}; });
    cfg = normalize(next);
    localStorage.setItem('lobbyCfg', JSON.stringify(cfg));
    $('dot').className = 'ok';
    paintStatic();
    await syncVideoSource();
    return true;
  } catch (e) {
    $('dot').className = 'err';
    return false;
  }
}
// דיווח־עצמי לפאנל: אילו תת־תיקיות קיימות כאן, כמה סרטונים נמצאו ומתי המסך היה חי.
async function reportRuntime() {
  try {
    await fetch(SB_URL + '/rest/v1/lobby_config?key=eq.runtime', {
      method: 'PATCH',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ value: { seenAt: new Date().toISOString(), root: srv.root, exists: srv.exists,
        folders: srv.folders, videoCount: srv.videos.length, local: !!LOCAL,
        screen: innerWidth + 'x' + innerHeight + ' @' + (devicePixelRatio || 1) + ' (' + screen.width + 'x' + screen.height + ')' } }),
    });
  } catch (e) {}
}

// ── סדר היום של היום ─────────────────────────────────────────────────────
function todayRows(now) {
  var d = now.getDay();
  if ((cfg.schedule.offDays || []).map(Number).indexOf(d) > -1) return [];
  var rows = (cfg.schedule.byDay || {})[d] || (cfg.schedule.byDay || {})[String(d)] || cfg.schedule.default || [];
  return rows.slice().filter(function (r) { return r && r.t; }).sort(function (a, b) { return a.t < b.t ? -1 : 1; });
}
var mins = function (t) { var p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1]); };
function slotAt(rows, now) {
  var cur = now.getHours() * 60 + now.getMinutes(), idx = -1;
  for (var i = 0; i < rows.length; i++) if (cur >= mins(rows[i].t)) idx = i;
  return idx;
}
/** מצב היום: איפה אנחנו, עד מתי, והאם אנחנו בפער שאחרי סיום משבצת. */
function dayState(rows, now) {
  var cur = now.getHours() * 60 + now.getMinutes();
  var idx = slotAt(rows, now);
  var slot = idx >= 0 ? rows[idx] : null;
  var nxt = (idx + 1) < rows.length ? rows[idx + 1] : null;
  var endM = slot && slot.end ? mins(slot.end) : (nxt ? mins(nxt.t) : null);
  // "פער" = המשבצת כבר נגמרה לפי שעת הסיום שלה, והבאה עוד לא התחילה
  var gap = !!(slot && slot.end && nxt && cur >= mins(slot.end));
  var over = !!(slot && !nxt && endM != null && cur >= endM);
  if (!slot && rows.length) gap = true;            // לפני פתיחת היום
  return { idx: idx, slot: slot, nxt: nxt, endM: endM, gap: gap, over: over };
}

// ── ציור סטטי (משתנה רק כשההגדרות משתנות) ────────────────────────────────
function paintStatic() {
  var d = cfg.display;
  $('brandText').textContent = d.headline || '';
  $('menuCard').style.display = (d.showMenu && menuForDisplay().m) ? 'block' : 'none';
  $('agendaCard').style.display = d.showAgenda ? 'flex' : 'none';
  $('zmanim').style.display = d.showZmanim ? 'flex' : 'none';
  if (!d.showParasha) $('parasha').style.display = 'none';
  $('tick').style.animationDuration = Math.max(20, Number(d.tickerSpeed) || 60) + 's';
  paintMenu(); paintTicker(); paintBirthCard();
  fitAll();
}

function menuFor(dateIso) { return (cfg.menu.days || {})[dateIso] || null; }

// אחרי הצהריים (או ביום בלי לימודים) מציגים את יום הלימודים הבא — התפריט של אתמול חסר תועלת.
function menuForDisplay() {
  var now = new Date(), key = isoOf(now), m = menuFor(key), label = 'היום';
  var late = now.getHours() >= 15;
  if (!m || m.off || late) {
    for (var i = 1; i <= 7; i++) {
      var nd = new Date(now); nd.setDate(nd.getDate() + i);
      var cand = menuFor(isoOf(nd));
      if (cand && !cand.off) { m = cand; key = isoOf(nd); label = (i === 1 ? 'מחר' : 'יום ' + DAYS[nd.getDay()]); break; }
    }
  }
  return { m: m, key: key, label: label };
}

function paintMenu() {
  if (!cfg.display.showMenu) return;
  var pick = menuForDisplay(), m = pick.m, key = pick.key, label = pick.label;
  var dt = new Date(key + 'T00:00:00');
  $('menuTitle').textContent = cfg.menu.title || 'ארוחת צהריים';
  if (!m) { $('menuDay').textContent = ''; $('menuMain').textContent = '—';
    $('menuSide').textContent = ''; $('menuVeg').textContent = ''; $('menuNote').textContent = 'לא הוזן תפריט'; return; }
  $('menuDay').textContent = label + ' · יום ' + DAYS[dt.getDay()] + ' · ' + hebDate(dt);
  if (m.off) {
    $('menuMain').textContent = m.note || 'אין לימודים';
    $('menuSide').textContent = ''; $('menuVeg').textContent = ''; $('menuNote').textContent = '';
  } else {
    $('menuMain').textContent = m.main || '';
    $('menuSide').textContent = m.side || '';
    $('menuVeg').textContent = m.veg || '';
    $('menuNote').textContent = m.note || '';
  }
}

// ── ימי הולדת ────────────────────────────────────────────────────────────
// מהפאנל מגיע רק התאריך העברי (יום/חודש/שנת לידה). את התאריך הלועזי של החגיגה
// הקרובה המסך מחשב בעצמו ומרענן כל יממה — כך הרשימה לא מתיישנת לעולם.
var HMON_HE = { Tishrei:'תשרי', Heshvan:'חשוון', Kislev:'כסלו', Tevet:'טבת', Shevat:'שבט',
  Adar:'אדר', 'Adar I':'אדר א׳', 'Adar II':'אדר ב׳', Nisan:'ניסן', Iyar:'אייר', Sivan:'סיוון',
  Tamuz:'תמוז', Av:'אב', Elul:'אלול' };
var GEM = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],
  [40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
function gematria(n) {
  n = Number(n) % 1000;
  if (n === 15) return 'ט״ו';
  if (n === 16) return 'ט״ז';
  var out = '';
  for (var i = 0; i < GEM.length; i++) while (n >= GEM[i][0]) { out += GEM[i][1]; n -= GEM[i][0]; }
  if (!out) return '';
  return out.length > 1 ? out.slice(0, -1) + '״' + out.slice(-1) : out + '׳';
}
var hebMapCache = null, hebMapDay = null;
function hebMap() {
  var key = isoOf(new Date());
  if (hebMapCache && hebMapDay === key) return hebMapCache;
  var t0 = new Date(); t0.setHours(12, 0, 0, 0);
  var map = [];
  for (var i = 0; i < 400; i++) {

  if (!el || !el.clientHeight) return;
  el.style.setProperty(varName, 1);
  var s = 1, guard = 0;
  while (el.scrollHeight > el.clientHeight + 2 && s > min && guard++ < 24) {
    s -= 0.06;
    el.style.setProperty(varName, s.toFixed(2));
  }
}

function fitSlide() {
  var el = document.querySelector('.slide.on');
  if (el) shrinkToFit(el, '--s', 0.45);
}
// הכרטיסים העליונים בגובה קבוע; אם מה שנשאר לסדר היום קטן מדי — מכווצים את
// כל הסרגל בבת אחת (גופנים וריפודים), עד שנשאר מקום לכמה שורות אמיתיות.
var MIN_AGENDA = 150;
// סדר הוויתור: קודם ימי הולדת, אחריהם התפריט. שניהם מוצגים גם בקרוסלה,
// בעוד שסדר היום הוא הדבר שמסתכלים עליו במעבר במסדרון.
var DROP_ORDER = ['birthCard', 'menuCard'];

function asideFree() {
  var aside = document.querySelector('aside');
  var used = 0, shown = 0;
  ['clockCard', 'menuCard', 'birthCard'].forEach(function (id) {
    var el = $(id);
    if (el && el.dataset.hidden !== '1' && getComputedStyle(el).display !== 'none') {
      used += el.getBoundingClientRect().height; shown++;
    }
  });
  return aside.clientHeight - used - shown * 12;
}

function fitAside() {
  var aside = document.querySelector('aside');
  if (!aside.clientHeight) return;
  // מחזירים למצב מלא לפני כל מדידה, אחרת ההסתרה מהפעם הקודמת נדבקת
  DROP_ORDER.forEach(function (id) {
    var el = $(id);
    if (el && el.dataset.hidden === '1') { el.dataset.hidden = ''; el.style.display = el.dataset.want || ''; }
  });
  var scale = 1;
  aside.style.setProperty('--side', 1);
  for (var i = 0; i < 14 && scale > 0.62; i++) {
    if (asideFree() >= MIN_AGENDA) return;
    scale -= 0.05;
    aside.style.setProperty('--side', scale.toFixed(2));
  }
  // עדיין צפוף — מורידים כרטיסים לפי סדר
  for (var j = 0; j < DROP_ORDER.length; j++) {
    if (asideFree() >= MIN_AGENDA) return;
    var el = $(DROP_ORDER[j]);
    if (el && getComputedStyle(el).display !== 'none') {
      el.dataset.want = el.style.display || '';
      el.dataset.hidden = '1';
      el.style.display = 'none';
    }
  }
}

var fitPending = null;
function fitAll() {
  if (fitPending) cancelAnimationFrame(fitPending);
  fitPending = requestAnimationFrame(function () {
    fitPending = null;
    fitAside();
    requestAnimationFrame(function () { drawAgenda(); fitSlide(); });
  });
}
window.addEventListener('resize', fitAll);
document.addEventListener('fullscreenchange', function () { setTimeout(fitAll, 120); });
if (window.ResizeObserver) {
  try {
    var ro = new ResizeObserver(fitAll);
    ro.observe(document.getElementById('stage'));
  } catch (e) {}
}

// ── הפעלה ────────────────────────────────────────────────────────────────
applyCache();
paintStatic();
tick();
setTimeout(fitAll, 200);
setInterval(tick, 1000);
setInterval(fitAll, 30000);     // רשת ביטחון: גופנים שנטענו מאוחר, שינוי תוכן
setInterval(paintMenu, 60000);
setInterval(paintTicker, 60000);
setInterval(paintBirthCard, 60000);

pullConfig().then(function (ok) { if (!ok) hint('אין חיבור לענן — מוצגות ההגדרות האחרונות שנשמרו'); });
bechLoad(); setInterval(bechLoad, 30 * 60000);
siachPull(); setInterval(siachPull, 300000);
setInterval(function () { pullConfig(); }, Math.max(15, Number(cfg.display.refreshSec) || 60) * 1000);
setInterval(reportRuntime, 120000);
// עדכון עצמי: גרסה חדשה של screen.html נטענת לבד תוך 2 דקות — אבל לא באמצע תוכנית ההפסקות
var BOOT_VER = null;
async function checkVersion() {
  if (LOCAL === null) return;
  try {
    var v = (await (await fetch((LOCAL || '') + '/api/version', { cache:'no-store' })).json()).v;
    if (BOOT_VER === null) BOOT_VER = v; else if (v !== BOOT_VER && !PROG.on) location.reload();
  } catch (e) {}
}
checkVersion(); setInterval(checkVersion, 120000);

fetchWeather(); fetchParasha(); fetchZmanim();
setInterval(fetchWeather, 10 * 60000);
setInterval(fetchParasha, 60 * 60000);
setInterval(fetchZmanim, 60 * 60000);

// מקשים: F = מסך מלא, R = רענון הגדרות מיידי, N = הסרטון הבא
document.addEventListener('keydown', function (e) {
  var k = e.key.toLowerCase();
  if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(function () {}); }
  if (k === 'r') { pullConfig(); hint('מרענן…'); setTimeout(function () { hint(''); }, 1500); }
  if (k === 'n' && lastVideoAllowed) playNext(false);
});
function toggleFs() {
  document.fullscreenElement ? document.exitFullscreen()
    : document.documentElement.requestFullscreen().catch(function () {});
}
document.addEventListener('dblclick', toggleFs);
$('fsBtn').addEventListener('click', toggleFs);
document.addEventListener('fullscreenchange', function () {
  document.body.classList.toggle('fs', !!document.fullscreenElement);
});
// ?fs=1 — נפתח מקישור "פתח מסך לובי": הדפדפן דורש מחווה של המשתמש למסך מלא,
// ולכן הכפתור מוצג בבירור והלחיצה הראשונה במסך נכנסת אליו.
if (new URLSearchParams(location.search).get('fs') === '1' && !document.fullscreenElement) {
  $('fsBtn').classList.add('show');
  hint('לחץ במסך (או F) למסך מלא');
  var once = function () {
    toggleFs(); hint(''); $('fsBtn').classList.remove('show');
    document.removeEventListener('click', once);
  };
  document.addEventListener('click', once);
}
})();
</script>
</body>
</html>
