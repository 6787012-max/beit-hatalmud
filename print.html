<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>דיווח הדפסה — מכינה בית התלמוד</title>
  <link rel="stylesheet" href="vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <style>
    .pr-opts { display: flex; gap: 8px; margin: 4px 0 14px; }
    .pr-opts button { flex: 1; padding: 12px 6px; border: 2px solid var(--line, #d6d3d1); border-radius: 10px; background: #fff; font: inherit; font-size: 1.05rem; cursor: pointer; }
    .pr-opts button.on { border-color: var(--primary, #1d4ed8); background: color-mix(in srgb, var(--primary, #1d4ed8) 10%, #fff); font-weight: 700; }
    .pr-lbl { display: block; font-weight: 600; margin: 0 0 4px; }
    .pr-done { text-align: center; padding: 10px 0; }
    .pr-done .big { font-size: 1.6rem; font-weight: 700; margin: 6px 0; }
  </style>
</head>
<body>
  <div class="sign-wrap">
    <div class="sign-card">
      <div class="sign-logo"><img src="img/logo.png" class="login-logo-img" alt="לוגו"></div>
      <div class="sign-inst" id="inst"></div>
      <h2 style="text-align:center;margin:4px 0 14px">דיווח הדפסה</h2>
      <div id="content"><p style="text-align:center;color:var(--muted)">טוען…</p></div>
    </div>
  </div>
  <script>
  // דף ציבורי לדיווח הדפסה ליד המדפסת — מחליף את טופס הגוגל של "נתוני הדפסות".
  // עובד רק עם הקוד האקראי שבקישור (?k=), ורק דרך שתי פונקציות RPC
  // (print_public_staff / print_public_report, migration_prints.sql) — אין גישה לטבלאות.
  (function () {
    const k = new URLSearchParams(location.search).get('k') || '';
    const C = window.CV3 || {};
    const content = document.getElementById('content');
    document.getElementById('inst').textContent = C.INSTANCE_NAME || '';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const money = n => '₪' + (Number(n) || 0).toFixed(2);
    const sb = (C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase)
      ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY) : null;
    const LAST = 'bht_print_staff';
    const fail = msg => { content.innerHTML = '<p style="text-align:center;color:#b91c1c">' + esc(msg) + '</p>'; };
    if (!sb || !/^[0-9a-f]{16,}$/.test(k)) return fail('הקישור אינו תקין. בקשו קישור חדש מהמזכירות.');

    sb.rpc('print_public_staff', { k }).then(({ data, error }) => {
      if (error) return fail('שגיאה: ' + error.message);
      if (!data || !data.length) return fail('הקישור אינו פעיל. בקשו קישור חדש מהמזכירות.');
      form(data);
    });

    function opts(id, list, def) {
      return '<div class="pr-opts" id="' + id + '">' + list.map(v => '<button type="button" data-v="' + esc(v) + '"' + (v === def ? ' class="on"' : '') + '>' + esc(v) + '</button>').join('') + '</div>';
    }
    function form(staff) {
      let last = ''; try { last = localStorage.getItem(LAST) || ''; } catch (_) {}
      content.innerHTML =
        '<label class="pr-lbl" for="who">שם</label><select class="inp" id="who"><option value="">— בחרו —</option>' +
          staff.map(s => '<option value="' + s.staff_id + '"' + (String(s.staff_id) === last ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select>' +
        '<span class="pr-lbl">סוג</span>' + opts('color', ['שחור לבן', 'צבעוני'], 'שחור לבן') +
        '<span class="pr-lbl">גודל דף</span>' + opts('size', ['A4', 'A3'], 'A4') +
        '<label class="pr-lbl" for="qty">כמות עמודים</label><input class="inp" id="qty" type="number" min="1" max="2000" inputmode="numeric">' +
        '<p id="msg" style="color:#b91c1c;min-height:1.2em;margin:6px 0"></p>' +
        '<button class="btn-primary" id="send" style="width:100%">שליחה</button>';
      content.querySelectorAll('.pr-opts').forEach(g => g.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      }));
      const val = id => { const b = content.querySelector('#' + id + ' .on'); return b ? b.dataset.v : ''; };
      content.querySelector('#send').addEventListener('click', async () => {
        const msg = content.querySelector('#msg'), btn = content.querySelector('#send');
        const sid = Number(content.querySelector('#who').value), qty = parseInt(content.querySelector('#qty').value, 10);
        if (!sid) { msg.textContent = 'נא לבחור שם.'; return; }
        if (!(qty > 0 && qty <= 2000)) { msg.textContent = 'נא להזין כמות עמודים (1–2000).'; return; }
        btn.disabled = true; msg.textContent = '';
        const { data, error } = await sb.rpc('print_public_report', { k, p_staff: sid, p_color: val('color'), p_size: val('size'), p_qty: qty });
        if (error) { btn.disabled = false; msg.textContent = 'השליחה נכשלה: ' + error.message; return; }
        try { localStorage.setItem(LAST, String(sid)); } catch (_) {}
        const r = (data && data[0]) || {}, bal = Number(r.balance);
        content.innerHTML = '<div class="pr-done"><i class="bi bi-check-circle-fill" style="font-size:2.4rem;color:#15803d"></i>' +
          '<div>נרשם: ' + qty + ' עמודים · ' + money(r.cost) + '</div>' +
          '<div class="big" style="color:' + (bal < 0 ? '#b91c1c' : '#15803d') + '">יתרה: ' + money(bal) + '</div>' +
          (bal < 0 ? '<div style="color:#b91c1c">אין יתרה — נא לטעון במזכירות.</div>' : '') +
          '<button class="btn-ghost" id="again" style="margin-top:12px">דיווח נוסף</button></div>';
        content.querySelector('#again').addEventListener('click', () => form(staff));
      });
    }
  })();
  </script>
</body>
</html>
